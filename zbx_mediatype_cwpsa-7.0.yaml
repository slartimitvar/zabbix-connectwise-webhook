zabbix_export:
  version: '7.0'
  media_types:
    - name: 'ConnectWise Manage PSA'
      type: WEBHOOK
      parameters:
        - name: alert_message
          value: '{ALERT.MESSAGE}'
        - name: alert_subject
          value: '{ALERT.SUBJECT}'
        - name: cwpsa_api_clientid
          value: '<your cw developer clientid>'
        - name: cwpsa_api_password
          value: '<your apimember privateKey>'
        - name: cwpsa_api_url
          value: 'https://<YOUR CW FQDN>/v4_6_release/apis/3.0/service/tickets/'
        - name: cwpsa_api_user
          value: '<your apimember company+publicKey>'
        - name: cwpsa_cmpy_customer_match
          value: 'problem name'
        - name: cwpsa_cmpy_DEFAULT
          value: '<default company client id>'
        - name: cwpsa_cmpy_XXX
          value: '<company xxx client id>'
        - name: cwpsa_configuration
          value: '<for example use the {HOST.NAME} to match a device>'
        - name: cwpsa_priority_for_average
          value: '<cw priority-average sev prob (2?)>'
        - name: cwpsa_priority_for_disaster
          value: '<cw priority-disaster sev prob (1?)>'
        - name: cwpsa_priority_for_high
          value: '<cw priority-high sev prob (1?)>'
        - name: cwpsa_priority_for_information
          value: '<cw priority-info sev prob (4?)>'
        - name: cwpsa_priority_for_not_classified
          value: '<cw priority-not classified sev prob (3?)>'
        - name: cwpsa_priority_for_warning
          value: '<cw priority-warning sev prob (2?)>'
        - name: cwpsa_priority_is_used
          value: 'true'
        - name: cwpsa_resolution_flag
          value: 'true'
        - name: cwpsa_serviceboard_name
          value: '<your cw board name>'
        - name: cwpsa_status_new
          value: '<your cw status for new tickets>'
        - name: cwpsa_status_resolved
          value: '<your cw status for resolved tickets>'
        - name: cwpsa_ticket_id
          value: '{EVENT.TAGS.cwpsa_ticket_id}'
        - name: cwpsa_type
          value: '<your cw ticket type>'
        - name: event_nseverity
          value: '{EVENT.NSEVERITY}'
        - name: event_recovery_value
          value: '{EVENT.RECOVERY.VALUE}'
        - name: event_source
          value: '{EVENT.SOURCE}'
        - name: event_status
          value: '{EVENT.STATUS}'
        - name: event_update_status
          value: '{EVENT.UPDATE.STATUS}'
        - name: event_value
          value: '{EVENT.VALUE}'
      script: |
        var CWPSA = {
            params: {},
        
            setParams: function (params) {
                if (typeof params !== 'object') {
                    return;
                }
        
                CWPSA.params = params;
                // Ensure API url ends with /
                if (typeof CWPSA.params.cwpsa_api_url === 'string') {
                    if (!CWPSA.params.cwpsa_api_url.endsWith('/')) {
                        CWPSA.params.cwpsa_api_url += '/';
                    }
                }
            },
        
            setProxy: function (HTTPProxy) {
                CWPSA.HTTPProxy = HTTPProxy;
            },
        
            // Fix dates to use hyphens
            setFields: function (data, fields) {
                if (typeof fields === 'object' && Object.keys(fields).length) {
                    Object.keys(fields)
                        .forEach(function(field) {
                            data[field] = (fields[field].match(/^\d{4}\.\d{2}\.\d{2}$/) !== null)
                                ? fields[field].replace(/\./g, '-')
                                : fields[field];
                        });
                }
            },
        
            request: function (method, data) {
                // Make sure we have the connection parameters
                ['clientid', 'password', 'user', 'url'].forEach(function (field) {
                    if (typeof CWPSA.params !== 'object' || typeof CWPSA.params[field] === 'undefined'
                        || CWPSA.params[field] === '' ) {
                        throw 'Required ConnectWise PSA parameter is not set: "' + field + '".';
                    }
                });
        
                var response,
                    url = CWPSA.params.url,
                    request = new HttpRequest();
        
                // Build header with clientId and base64 encoded authentication parameters
                request.addHeader('Content-Type: application/json');
                request.addHeader('clientId: ' + CWPSA.params.clientid);
                request.addHeader('Authorization: Basic ' + btoa(CWPSA.params.user + ':' + CWPSA.params.password));
        
                if (typeof CWPSA.HTTPProxy !== 'undefined' && CWPSA.HTTPProxy !== '') {
                    request.setProxy(CWPSA.HTTPProxy);
                }
        
                if (typeof data !== 'undefined') {
                    data = JSON.stringify(data);
                }
        
                Zabbix.log(4, '[ ConnectWise Manage PSA Webhook 1 ] Sending request: ' + url + ((typeof data === 'string')
                    ? ('\n' + data)
                    : ''));
        
                switch (method) {
                    case 'post':
                        response = request.post(url, data);
                        break;
        
                    case 'patch':
                        data = '[' + data + ']';
                        response = request.patch(url, data);
                        break;
        
                    case 'get': // added
                        response = request.get(url);
                        break;
        
                    default:
                        throw 'Unsupported HTTP request method: ' + method;
                }
        
                Zabbix.log(4, '[ ConnectWise Manage PSA Webhook 2 ] Received response with status code ' +
                    request.getStatus() + '\n' + response);
        
                if (response !== null) {
                    try {
                        response = JSON.parse(response);
                    }
                    catch (error) {
                        Zabbix.log(4, '[ ConnectWise Manage PSA Webhook 3 ] Failed to parse response received from ConnectWise Manage PSA');
                        response = null;
                    }
                }
        
                if (request.getStatus() < 200 || request.getStatus() >= 300) {
                    var message = 'Request failed with status code ' + request.getStatus();
        
                    if (response !== null && response.error && typeof response.error.message !== 'undefined'
                        && Object.keys(response.error).length > 0) {
                        message += ': ' + JSON.stringify(response.error.message);
                    }
        
                    throw message + ' Check debug log for more information.';
                }
                else if (response === null || (typeof response !== 'object' && !Array.isArray(response))) {
                    throw 'Cannot create/update ConnectWise Manage PSA ticket. Response result is not an object/array. Check debug log for more information.';
                }
                else {
                    // Only require an ID when we *create a ticket* (POST /service/tickets)
                    var isTicketCreate = (method === 'post') && /\/service\/tickets\/?$/i.test(url);
                    if (isTicketCreate && (typeof response.id === 'undefined')) {
                        throw 'Cannot create/update ConnectWise Manage PSA ticket. Response result ID is undefined. Check debug log for more information.';
                    }
                }
        
                return response;
            }
        };
        
        try {
            var params = JSON.parse(value),
                fields = {},
                cwpsa = {},
                data = {},
                patchdata = {},
                notedata = {},
                result = {tags: {}},
                required_params = [
                    'alert_subject', 'alert_message', 'event_source', 'event_value',
                    'event_update_status', 'event_recovery_value', 'event_nseverity',
                    'cwpsa_cmpy_DEFAULT', 'cwpsa_resolution_flag', 'cwpsa_serviceboard_name',
                    'cwpsa_status_resolved'
                ],
                severities = [
                    {name: 'not_classified', color: '#97AAB3'},
                    {name: 'information', color: '#7499FF'},
                    {name: 'warning', color: '#FFC859'},
                    {name: 'average', color: '#FFA059'},
                    {name: 'high', color: '#E97659'},
                    {name: 'disaster', color: '#E45959'},
                    {name: 'resolved', color: '#009900'},
                    {name: 'default', color: '#000000'}
                ],
                priorities = [
                    'Priority 1 - Critical',
                    'Priority 2 - High',
                    'Priority 3 - Medium',
                    'Priority 4 - Low'
                ],
                process_tags = true;
                cmpy_tla = '_CA';
        
            // Process parameters
            Object.keys(params)
                .forEach(function (key) {
                    // Prepare API connection parameters
                    if (key.startsWith('cwpsa_api_')) {
                        cwpsa[key.substring(10)] = params[key];
                    }
                    // Prepare CW company three letter acronyms and check company Client ID exists
                    else if (key.startsWith('cwpsa_cmpy_')) {
                        if (params[key] !== '') {
                            cwpsa['cmpy_tla_' + key.substring(11)] = params[key];
                        } else {
                            throw 'Parameter "' + key + '" can\'t be empty and must contain the CW company Client ID.';
                        }
                    }
                    // Prepare CW priority mapping
                    else if (params.cwpsa_priority_is_used === 'true') {
                        if (key.startsWith('cwpsa_priority_for_')) {
                            if (params[key] !== '' && [1, 2, 3, 4].indexOf(parseInt(params[key])) !== -1) {
                                cwpsa['priority_' + key.substring(19)] = params[key];
                            } else {
                                throw 'If parameter priority_is_used is true, "' + key + '" can\'t be empty and must exist in the range 1 to 4.';
                            }
                        }
                    }
        
                    // Check required fields present
                    else if (required_params.indexOf(key) !== -1 && params[key] === '') {
                        throw 'Parameter "' + key + '" can\'t be empty.';
                    }
                });
        
            // Check event_source sanity
            if ([0, 1, 2, 3].indexOf(parseInt(params.event_source)) === -1) {
                throw 'Incorrect "event_source" parameter given: ' + params.event_source + '\nMust be 0-3.';
            }
        
            // Use default nseverity if not specified
            if ([0, 1, 2, 3, 4, 5].indexOf(parseInt(params.event_nseverity)) === -1) {
                params.event_nseverity = '0';
            }
        
            // Check {EVENT.VALUE} for trigger-based and internal events.
            if (params.event_value !== '0' && params.event_value !== '1'
                && (params.event_source === '0' || params.event_source === '3')) {
                throw 'Incorrect "event_value" parameter given: ' + params.event_value + '\nMust be 0 or 1.';
            }
        
            // Check {EVENT.UPDATE.STATUS} only for trigger-based events.
            if (params.event_update_status !== '0' && params.event_update_status !== '1' && params.event_source === '0') {
                throw 'Incorrect "event_update_status" parameter given: ' + params.event_update_status + '\nMust be 0 or 1.';
            }
        
            // No recovery for non-trigger based events
            if (params.event_source !== '0' && params.event_recovery_value === '0') {
                throw 'Recovery operations are supported only for trigger-based actions.';
            }
        
        	// === Company matching: by problem-name TLA (default) or by "customer" problem tag ===
        	var matchMode = (params.cwpsa_cmpy_customer_match || 'problem name').toString().toLowerCase();
        	var matchKey = null;
        
        	if (matchMode === 'customer tag') {
        	    // 1) simplest: media passes a direct customer param
        	    if (typeof params.customer === 'string' && params.customer.trim()) {
        	        matchKey = params.customer.trim().toUpperCase();
        	    }
        	    // 2) or standard Zabbix {EVENT.TAGSJSON}
        	    else if (params.event_tags_json) {
        	        try {
        	            var tags = (typeof params.event_tags_json === 'string')
        	                ? JSON.parse(params.event_tags_json)
        	                : params.event_tags_json;
        	            if (Array.isArray(tags)) {
        	                for (var i = 0; i < tags.length; i++) {
        	                    var k = (tags[i].tag || tags[i].key || '').toString().toLowerCase();
        	                    if (k === 'customer' && tags[i].value) {
        	                        matchKey = tags[i].value.toString().trim().toUpperCase();
        	                        break;
        	                    }
        	                }
        	            }
        	        } catch (e) { /* ignore and fall back */ }
        	    }
        	}
        
        	// Fallback to original behavior
        	if (!matchKey) {
        	    matchKey = (params.alert_subject || '').substring(0, 3).toUpperCase();
        	}
        
        	// Resolve to company_id via cwpsa_cmpy_XXX mapping; default if not found
        	if (typeof cwpsa['cmpy_tla_' + matchKey] !== 'undefined') {
        	    company_id = cwpsa['cmpy_tla_' + matchKey];
        	} else {
        	    company_id = params.cwpsa_cmpy_DEFAULT;
        	}
        	// === end company matching ===
        
            // --- (NEW) Resolve configuration first so we can set site/priority on the ticket before creation ---
            var matchedConfig = null;
            if (typeof params.cwpsa_configuration === 'string' && params.cwpsa_configuration !== '') {
                try {
                    // Derive API root (strip /service/tickets...) and trim trailing slash
                    var apiRoot = cwpsa.url;
                    var svcIdx = apiRoot.toLowerCase().indexOf('/service/tickets');
                    if (svcIdx !== -1) apiRoot = apiRoot.substring(0, svcIdx);
                    if (apiRoot.endsWith('/')) apiRoot = apiRoot.slice(0, -1);
        
                    // Exact match on name + company/identifier
                    var safeName = params.cwpsa_configuration.replace(/"/g, '\\"');
                    var conditions = 'name="' + safeName + '" and company/identifier="' + company_id + '"';
                    var cfgSearchUrl = apiRoot + '/company/configurations?conditions=' + encodeURIComponent(conditions) + '&pageSize=1';
        
                    var lookupParams = JSON.parse(JSON.stringify(cwpsa));
                    lookupParams.url = cfgSearchUrl;
        
                    CWPSA.setParams(lookupParams);
                    CWPSA.setProxy(params.HTTPProxy);
                    var cfgList = CWPSA.request('get');
        
                    if (Array.isArray(cfgList) && cfgList.length && typeof cfgList[0].id !== 'undefined') {
                        matchedConfig = cfgList[0];
                        Zabbix.log(4, '[CW ConfigLookup] Found configuration "' + params.cwpsa_configuration + '" (ID ' + matchedConfig.id + ') for company "' + company_id + '".');
                    } else {
                        Zabbix.log(3, '[CW ConfigLookup] No configuration found with exact name "' + params.cwpsa_configuration + '" for company "' + company_id + '".');
                    }
                } catch (cfgLookupErr) {
                    Zabbix.log(3, '[CW ConfigLookup] Lookup failed: ' + cfgLookupErr + '. Proceeding without configuration.');
                }
            }
        
            // Set data for new ticket post
            data = {
                summary: params.alert_subject.substring(0,100),
                recordType: 'ServiceTicket',
                board: {
                    name: params.cwpsa_serviceboard_name
                },
                status: {
                    name: params.cwpsa_status_new
                },
                type: {
                    name: params.cwpsa_type
                },
                company: {
                    identifier: company_id
                },
                initialDescription: params.alert_message
            };
        
            // If configuration has a site, set it now so it’s on the ticket at creation
            if (matchedConfig && matchedConfig.site && (matchedConfig.site.id || matchedConfig.site.name)) {
                data.site = {};
                if (matchedConfig.site.id)   data.site.id   = matchedConfig.site.id;
                if (matchedConfig.site.name) data.site.name = matchedConfig.site.name;
                Zabbix.log(4, '[CW ConfigApply] Ticket site set from configuration: ' + JSON.stringify(data.site));
            }
        
            // Priority: prefer a "Default Priority" custom field on the configuration if present; else use severity mapping
            var configPriorityName = null;
            if (matchedConfig && Array.isArray(matchedConfig.customFields)) {
                for (var i = 0; i < matchedConfig.customFields.length; i++) {
                    var cf = matchedConfig.customFields[i];
                    if (typeof cf.caption === 'string' && cf.caption.toLowerCase() === 'default priority' && cf.value) {
                        configPriorityName = String(cf.value);
                        break;
                    }
                }
            }
        
            if (configPriorityName) {
                // Only set if it looks like a valid CW priority name
                if (priorities.indexOf(configPriorityName) !== -1) {
                    data.priority = { name: configPriorityName };
                    Zabbix.log(4, '[CW ConfigApply] Ticket priority set from configuration custom field: ' + configPriorityName);
                } else {
                    Zabbix.log(3, '[CW ConfigApply] Default Priority "' + configPriorityName + '" not in allowed list; falling back to severity mapping.');
                }
            }
        
            // If no config-derived priority, use your existing severity→priority mapping when enabled
            if (!data.priority && params.cwpsa_priority_is_used === 'true') {
                if (typeof cwpsa['priority_' + severities[params.event_nseverity].name] !== 'undefined') {
                    data.priority = { name: priorities[cwpsa['priority_' + severities[params.event_nseverity].name] - 1] };
                } else {
                    data.initialDescription += ' | priority_' + priorities[cwpsa['priority_' + severities[params.event_nseverity].name] - 1] + ' is undefined';
                    throw 'Attempting to use CW priorities but ' + 'priority_' + severities[params.event_nseverity].name + ' is undefined';
                }
            }
        
            // If this is an update, patch existing CWPSA ticket and/or add a note
            if (params.event_source === '0' && (params.event_value === '0' || params.event_update_status === '1')) {
                process_tags = false;
        
                // If update is status "RESOLVED", set new ticket status and add note
                if (params.event_status === "RESOLVED") {
                    // Set patch data
                    method = 'patch';
                    patchdata.op = "replace";
                    patchdata.path = "status/name";
                    patchdata.value = params.cwpsa_status_resolved;
                    // Make request
                    CWPSA.setParams(cwpsa);
                    CWPSA.setProxy(params.HTTPProxy);
                    CWPSA.setFields(patchdata, fields);
                    CWPSA.params.url += params.cwpsa_ticket_id;
                    var response = CWPSA.request(method, patchdata);
        
                    // Create ticket note data
                    method = 'post';
                    notedata.text = params.alert_message;
                    notedata.detailDescriptionFlag = true;
                    if (params.cwpsa_resolution_flag === 'true') {
                        notedata.resolutionFlag = true;
                    }
                    // Make request
                    CWPSA.setParams(cwpsa);
                    CWPSA.setProxy(params.HTTPProxy);
                    CWPSA.setFields(notedata, fields);
                    CWPSA.params.url += '/notes';
                    var response = CWPSA.request(method, notedata);
        
                } else {
                    // Add an update note only
                    method = 'post';
                    notedata.text = params.alert_message;
                    notedata.detailDescriptionFlag = true;
                    notedata.resolutionFlag = false;
                    // Make request
                    CWPSA.setParams(cwpsa);
                    CWPSA.setProxy(params.HTTPProxy);
                    CWPSA.setFields(notedata, fields);
                    CWPSA.params.url += params.cwpsa_ticket_id + '/notes';
                    var response = CWPSA.request(method, notedata);
                }
        
            } else {
                // Create the ticket (with site/priority already applied if config found)
                method = 'post';
                CWPSA.setParams(cwpsa);
                CWPSA.setProxy(params.HTTPProxy);
                CWPSA.setFields(data, fields);
                var response = CWPSA.request(method, data);
        
                // Attach the configuration to the new ticket so it appears on the Configurations tab
                try {
                    if (matchedConfig && typeof matchedConfig.id !== 'undefined') {
                        var linkParams = JSON.parse(JSON.stringify(cwpsa));
                        linkParams.url = cwpsa.url + response.id + '/configurations';
                        var linkBody = { id: matchedConfig.id };
        
                        CWPSA.setParams(linkParams);
                        CWPSA.setProxy(params.HTTPProxy);
                        CWPSA.setFields(linkBody, fields);
                        CWPSA.request('post', linkBody);
        
                        Zabbix.log(4, '[CW ConfigLink] Linked configuration ID ' + matchedConfig.id + ' to ticket ' + response.id);
                    }
                } catch (cfgErr) {
                    Zabbix.log(3, '[CW ConfigLink] Post-create link failed: ' + cfgErr);
                }
            }
        
            // Get CW ticket ID into problem tag if enabled
            if (process_tags) {
                result.tags.cwpsa_ticket_id = response.id;
            }
        
            return JSON.stringify(result);
        }
        catch (error) {
            Zabbix.log(3, '[ ConnectWise Manage PSA Webhook 4 ] ERROR: ' + error);
            throw 'Sending failed: ' + error;
        }
      process_tags: 'YES'
      show_event_menu: 'YES'
      event_menu_url: 'https://<YOUR CW FQDN>/v4_6_release/services/system_io/Service/fv_sr100_request.rails?service_recid={EVENT.TAGS.cwpsa_link}'
      event_menu_name: 'ConnectWise Ticket: {EVENT.TAGS.cwpsa_ticket_id}'
      description: 'Hosted at https://github.com/slartimitvar/zabbix-connectwise-webhook'
      message_templates:
        - event_source: TRIGGERS
          operation_mode: PROBLEM
          subject: 'Problem: Sev {TRIGGER.SEVERITY} : {EVENT.NAME}'
          message: |
            **::: {EVENT.NAME} :::**
            
            Severity: {TRIGGER.SEVERITY}
            Host name: {HOST.NAME}
            Problem name: {TRIGGER.NAME}
            IP address: {HOST.IP}
            
            Problem:
            
            Event ID: {EVENT.ID}
            Event value: {EVENT.VALUE}
            Event status: {EVENT.STATUS}
            Event time: {EVENT.TIME}
            Event date: {EVENT.DATE}
            Event age: {EVENT.AGE}
            Event acknowledgment: {EVENT.ACK.STATUS}
            Event update history: {EVENT.UPDATE.HISTORY}
        - event_source: TRIGGERS
          operation_mode: RECOVERY
          subject: 'Resolved: Sev {TRIGGER.SEVERITY} : {EVENT.NAME}'
          message: |
            **::: {EVENT.NAME} :::**
            
            Severity: {TRIGGER.SEVERITY}
            Host name: {HOST.NAME}
            Problem name: {TRIGGER.NAME}
            IP address: {HOST.IP}
            
            Problem:
            
            Event ID: {EVENT.ID}
            Event value: {EVENT.VALUE}
            Event status: {EVENT.STATUS}
            Event time: {EVENT.TIME}
            Event date: {EVENT.DATE}
            Event age: {EVENT.AGE}
            Event acknowledgment: {EVENT.ACK.STATUS}
            Event update history: {EVENT.UPDATE.HISTORY}
            
            Recovery:
            
            Event ID: {EVENT.RECOVERY.ID}
            Event value: {EVENT.RECOVERY.VALUE}
            Event status: {EVENT.RECOVERY.STATUS}
            Event time: {EVENT.RECOVERY.TIME}
            Event date: {EVENT.RECOVERY.DATE}
            Operational data: {EVENT.OPDATA}
        - event_source: TRIGGERS
          operation_mode: UPDATE
          subject: 'Updated problem in {EVENT.AGE}: {EVENT.NAME}'
          message: |
            **Update**
            
            {EVENT.UPDATE.MESSAGE}
            
            Update made by : {USER.FULLNAME} {EVENT.UPDATE.ACTION}
            At : {EVENT.UPDATE.DATE} {EVENT.UPDATE.TIME}.
            
            Current status : {EVENT.STATUS}
            Age : {EVENT.AGE}
            Acknowledged : {EVENT.ACK.STATUS}
        - event_source: DISCOVERY
          operation_mode: PROBLEM
          subject: 'Discovery: {DISCOVERY.DEVICE.STATUS} {DISCOVERY.DEVICE.IPADDRESS}'
          message: |
            Discovery rule: {DISCOVERY.RULE.NAME}
            
            Device IP: {DISCOVERY.DEVICE.IPADDRESS}
            Device DNS: {DISCOVERY.DEVICE.DNS}
            Device status: {DISCOVERY.DEVICE.STATUS}
            Device uptime: {DISCOVERY.DEVICE.UPTIME}
            
            Device service name: {DISCOVERY.SERVICE.NAME}
            Device service port: {DISCOVERY.SERVICE.PORT}
            Device service status: {DISCOVERY.SERVICE.STATUS}
            Device service uptime: {DISCOVERY.SERVICE.UPTIME}
        - event_source: AUTOREGISTRATION
          operation_mode: PROBLEM
          subject: 'Autoregistration: {HOST.HOST}'
          message: |
            Host name: {HOST.HOST}
            Host IP: {HOST.IP}
            Agent port: {HOST.PORT}
